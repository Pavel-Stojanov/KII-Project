apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: library-api
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Pavel-Stojanov/KII-Project.git
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: library-api
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
