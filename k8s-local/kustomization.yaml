apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Local k3d variant of k8s/. Differences from the Argo CD / AKS manifests:
#   - plain Secrets (generated by ./gen-secrets.sh, gitignored) instead of SealedSecrets
#   - no cert-manager ClusterIssuer; ingress is host-less and has no TLS
#   - locally-built images (library-api-*:local) imported into k3d
# Run ./gen-secrets.sh before the first `kubectl apply -k`.
resources:
- namespace.yaml
- mongodb/configmap.yaml
- mongodb/secret.yaml
- mongodb/keyfile.secret.yaml
- mongodb/service.yaml
- mongodb/statefulset.yaml
- mongodb/rs-init-job.yaml
- backend/configmap.yaml
- backend/secret.yaml
- backend/service.yaml
- backend/deployment.yaml
- frontend/service.yaml
- frontend/deployment.yaml
- ingress.yaml
