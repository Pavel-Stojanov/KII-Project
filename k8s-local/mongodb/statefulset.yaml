apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb
  namespace: library-api
spec:
  serviceName: mongodb
  replicas: 3
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      # Secret-mounted files are root-owned; mongod runs as uid 999 and rejects a
      # keyfile it cannot read or that is group/world-readable. Copy it to an
      # emptyDir with the required 0400 perms and ownership before mongod starts.
      initContainers:
        - name: keyfile-perms
          image: mongo:7
          command:
            - sh
            - -c
            - |
              cp /tmp/keyfile/keyfile /etc/mongodb-keyfile/keyfile
              chmod 400 /etc/mongodb-keyfile/keyfile
              chown 999:999 /etc/mongodb-keyfile/keyfile
          volumeMounts:
            - name: keyfile-secret
              mountPath: /tmp/keyfile
            - name: keyfile
              mountPath: /etc/mongodb-keyfile
      containers:
        - name: mongodb
          image: mongo:7
          # Args are passed to the image entrypoint (not a command override), so
          # MONGO_INITDB_* root-user creation and the gosu step-down still run.
          args:
            - --replSet
            - rs0
            - --bind_ip_all
            - --keyFile
            - /etc/mongodb-keyfile/keyfile
          ports:
            - containerPort: 27017
          envFrom:
            - secretRef:
                name: mongodb-secret
            - configMapRef:
                name: mongodb-config
          volumeMounts:
            - name: mongodb-data
              mountPath: /data/db
            - name: keyfile
              mountPath: /etc/mongodb-keyfile
          readinessProbe:
            exec:
              command: ["mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
      volumes:
        - name: keyfile-secret
          secret:
            secretName: mongodb-keyfile
            defaultMode: 0400
        - name: keyfile
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: mongodb-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
