apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: library-api-ingress
  namespace: library-api
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
spec:
  # No host and no TLS — local access is plain http://localhost via ingress-nginx.
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8080
          - path: /swagger-ui
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8080
          - path: /v3/api-docs
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8080
          - path: /actuator
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
