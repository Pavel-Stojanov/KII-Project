apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# NOTE: the *.sealedsecret.yaml files are produced by ./seal-secrets.sh and must
# exist before `kubectl kustomize` / Argo CD can build this. The raw *.secret.yaml
# sources are gitignored.
resources:
- namespace.yaml
- mongodb/configmap.yaml
- mongodb/sealedsecret.yaml
- mongodb/keyfile.sealedsecret.yaml
- mongodb/service.yaml
- mongodb/statefulset.yaml
- mongodb/rs-init-job.yaml
- backend/configmap.yaml
- backend/sealedsecret.yaml
- backend/service.yaml
- backend/deployment.yaml
- frontend/service.yaml
- frontend/deployment.yaml
- clusterissuer.yaml
- ingress.yaml

images:
- name: frikzy/library-api-backend
  newName: frikzy/library-api-backend
  newTag: 2106a77130f01713573c5a0559c98cfd4fb70c18
- name: frikzy/library-api-frontend
  newName: frikzy/library-api-frontend
  newTag: 2106a77130f01713573c5a0559c98cfd4fb70c18
