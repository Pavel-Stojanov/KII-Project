# Template. Copy to secret.yaml (gitignored), fill in real values, then run k8s/seal-secrets.sh.
apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
  namespace: library-api
type: Opaque
stringData:
  # Base64 256-bit key: openssl rand -base64 32
  JWT_SECRET_KEY: "REPLACE_ME"
  # Replica-set connection string — lists all 3 mongod members + replicaSet=rs0.
  SPRING_MONGODB_URI: "mongodb://USER:PASSWORD@mongodb-0.mongodb.library-api.svc.cluster.local:27017,mongodb-1.mongodb.library-api.svc.cluster.local:27017,mongodb-2.mongodb.library-api.svc.cluster.local:27017/library-db?replicaSet=rs0&authSource=admin"
